name: Trigger QuantMan API Login

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-login]

# REQUIRED: Grants permission to generate the GitHub OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  run-login:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Root to Wake Instance
        run: |
          curl -s https://quantman-login-api.onrender.com/

      - name: Send Login Request with Auto-Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3               # Try up to 3 times if it fails
          retry_wait_seconds: 60        # Wait 60 seconds between each retry attempt
          command: |
            # Fetch a FRESH GitHub OIDC token on every attempt. These tokens are
            # short-lived (a few minutes) — if we fetched one only once before the
            # retry loop and reused it, a slow first attempt could make a later
            # (otherwise-valid) retry get rejected with "Signature has expired"
            # instead of actually retrying the login.
            TOKEN=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=render-api-audience" | jq -r '.value')
            echo "::add-mask::$TOKEN"

            # Secret names kept short on purpose (U/P/S/B) so setup only takes typing
            # a single letter into GitHub's "New repository secret" name field, no
            # copying a long name back and forth. What each one is:
            #   U -> QuantMan client/user ID     P -> broker password
            #   S -> TOTP secret                 B -> broker name (aliceblue/flattrade)
            #
            # Each one falls back to the original long-form name (QUANTMAN_CLIENT_ID,
            # etc.) if the short one isn't set. This is what keeps ONE template file
            # safe for both old and new clients: syncing a fork only updates files —
            # it never touches actual Secrets values — so an older client whose fork
            # picks up this file via GitHub's "Sync fork" button still has their real
            # credentials under the long names, and this file finds them there instead
            # of silently sending an empty login request.
            U="${{ secrets.U }}"
            if [ -z "$U" ]; then U="${{ secrets.QUANTMAN_CLIENT_ID }}"; fi
            P="${{ secrets.P }}"
            if [ -z "$P" ]; then P="${{ secrets.QUANTMAN_PASSWORD }}"; fi
            S="${{ secrets.S }}"
            if [ -z "$S" ]; then S="${{ secrets.QUANTMAN_TOTP_SECRET }}"; fi
            B="${{ secrets.B }}"
            if [ -z "$B" ]; then B="${{ secrets.BROKER }}"; fi

            RESPONSE=$(curl -s -w "%{http_code}" -X POST https://quantman-login-api.onrender.com/login \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d "{
                \"client_id\": \"$U\",
                \"password\": \"$P\",
                \"totp_secret\": \"$S\",
                \"broker\": \"$B\"
              }")

            HTTP_CODE="${RESPONSE: -3}"
            BODY="${RESPONSE%???}"

            echo "Response Code: $HTTP_CODE"
            echo "Response Body: $BODY"

            # If the server doesn't return a 200 OK, fail the step so the retry action kicks in
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "Error: API call failed with status $HTTP_CODE"
              exit 1
            fi
